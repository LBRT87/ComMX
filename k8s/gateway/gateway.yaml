apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: 
  name: commx-gateway
  namespace: commx
  labels: 
    app.kubernetes.io/name: commx-gateway
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - name: commx-tls-cert
      allowedRoutes:
        namespaces:
          from: Same