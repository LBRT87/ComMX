apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: commx-pool
  namespace: metallb-system
spec:
  addresses:
    - 192.168.1.200-192.168.1.220
  autoAssign: false
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: commx-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - commx-pool
  nodeSelectors:
    - matchLabels:
        kubernetes.io/hostname: k8s-cp-03
    - matchLabels:
        kubernetes.io/hostname: k8s-worker-03
