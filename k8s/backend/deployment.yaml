apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: commx
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: commx
    app: backend
    owner: prk
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: commx
        app: backend
        owner: prk
    spec:
      containers:
        - name: backend
          image: 192.168.2.5:5000/group-2/commx-backend:a0860c6940e57be554a3b50fa467164ae0c7e1bc
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: commx-config
            - secretRef:
                name: commx-secret
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: commx-secret
                  key: DATABASE_URL
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
      imagePullSecrets:
        - name: registry-credentials
